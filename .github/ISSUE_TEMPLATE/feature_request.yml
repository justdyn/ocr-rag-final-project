name: Feature request
description: Propose a product or tooling change
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Describe the need. Check `.docs/prd/` and handoff before asking for scope that conflicts with locked architecture.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who hits this, and what's painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior (not implementation dump)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (Remix BFF / app)
        - Backend (FastAPI)
        - Both
        - Docs / CI
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this request is not asking for
    validations:
      required: false
